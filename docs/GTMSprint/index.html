    <script>
      (function () {
        var C = window.PAGE_COPY;
        if (!C) return;

        function $(sel) {
          return document.querySelector('[data-copy="' + sel + '"]');
        }

        function list(items, cls) {
          return (
            '<ul class="' + cls + '">' +
            items.map(function (item) { return "<li>" + item + "</li>"; }).join("") +
            "</ul>"
          );
        }

        var video = $("video");
        if (video && C.video) {
          var desktopSrc =
            C.video.src ||
            video.getAttribute("data-src-desktop") ||
            video.getAttribute("src");
          var phoneSrc =
            C.video.srcPhone || video.getAttribute("data-src-phone") || desktopSrc;
          var phoneMq = window.matchMedia("(max-width: 899px)");
          function applyHeroVideo() {
            var next = phoneMq.matches ? phoneSrc : desktopSrc;
            if (video.getAttribute("src") !== next) {
              video.src = next;
              video.load();
              var play = video.play();
              if (play && typeof play.catch === "function") play.catch(function () {});
            }
          }
          applyHeroVideo();
          if (typeof phoneMq.addEventListener === "function") {
            phoneMq.addEventListener("change", applyHeroVideo);
          } else if (typeof phoneMq.addListener === "function") {
            phoneMq.addListener(applyHeroVideo);
          }
        }

        var promise = $("promise");
        if (promise && C.promise) promise.textContent = C.promise;

        var hook = $("hook");
        if (hook && C.hook) hook.textContent = C.hook;

        var how = $("how");
        if (how && C.how) {
          how.innerHTML =
            '<div class="how__head">' +
            '<h2 class="sec__title">' + C.how.title + "</h2>" +
            '<a class="btn how__agenda" href="./agenda/">View Full Agenda</a>' +
            "</div>" +
            '<p class="sec__lede">' +
            '<span class="sec__lede-full">' + C.how.lede + "</span>" +
            (C.how.ledePhone ? '<span class="sec__lede-phone">' + C.how.ledePhone + "</span>" : "") +
            "</p>" +
            '<ol class="steps">' +
            C.how.steps
              .map(function (s) {
                return (
                  '<li class="step">' +
                  '<h3 class="step__title">' + s.when + "</h3>" +
                  (s.lead ? '<p class="step__body">' + s.lead + "</p>" : "") +
                  (s.bullets && s.bullets.length ? list(s.bullets, "step__list") : "") +
                  (s.photo
                    ? '<figure class="step__photo"><img src="' + s.photo.src + '" alt="' + s.photo.alt +
                      '" loading="lazy" onerror="this.style.visibility=\'hidden\'" /></figure>'
                    : "") +
                  "</li>"
                );
              })
              .join("") +
            "</ol>";
        }

        var prizes = $("prizes");
        if (prizes && C.prizes) {
          prizes.innerHTML =
            '<h2 class="split__title">' + C.prizes.title + "</h2>" +
            '<ol class="gets">' +
            C.prizes.items
              .map(function (item, i) {
                return (
                  "<li>" +
                  '<span class="gets__num">0' + (i + 1) + "</span>" +
                  '<span class="gets__what">' + item + "</span>" +
                  "</li>"
                );
              })
              .join("") +
            "</ol>";
        }

        var gets = $("gets");
        if (gets && C.gets) {
          gets.innerHTML =
            '<h2 class="split__title">' + C.gets.title + "</h2>" +
            '<ol class="gets">' +
            C.gets.items
              .map(function (it, i) {
                return (
                  "<li>" +
                  '<span class="gets__num">0' + (i + 1) + "</span>" +
                  "<span>" +
                  '<span class="gets__what">' +
                  (it.href ? '<a href="' + it.href + '">' + it.what + "</a>" : it.what) +
                  "</span>" +
                  (it.note ? '<span class="gets__note">' + it.note + "</span>" : "") +
                  "</span>" +
                  "</li>"
                );
              })
              .join("") +
            "</ol>";
        }

        var why = $("why");
        if (why && C.why) {
          why.innerHTML =
            '<h2 class="why__title">' + C.why.title + "</h2>" +
            '<p class="why__body">' + C.why.body + "</p>";
        }

        var faq = $("faq");
        if (faq && C.faq && C.faq.items) {
          faq.innerHTML =
            '<h2 class="faq__title">' + C.faq.title + "</h2>" +
            '<div class="faq__list">' +
            C.faq.items
              .map(function (item) {
                return (
                  '<details class="faq__item">' +
                  "<summary>" +
                  '<span class="faq__q">' + item.q + "</span>" +
                  '<span class="faq__icon" aria-hidden="true"></span>' +
                  "</summary>" +
                  '<div class="faq__a">' + item.a + "</div>" +
                  "</details>"
                );
              })
              .join("") +
            "</div>";
        }

        var partnersLabel = $("partnersLabel");
        if (partnersLabel) partnersLabel.textContent = C.partnersLabel;

        var ctaLine = $("cta.line");
        if (ctaLine && C.cta) ctaLine.textContent = C.cta.line;

        var ctaButtons = $("cta.buttons");
        if (ctaButtons && C.cta && C.cta.buttons) {
          ctaButtons.innerHTML = C.cta.buttons
            .map(function (b, i) {
              return (
                '<a class="btn' + (i ? " btn--ghost" : "") + '" href="' +
                (b.href || "mailto:" + C.cta.mail + "?subject=" + encodeURIComponent(b.subject)) +
                '">' + b.label + "</a>"
              );
            })
            .join("");
        }

        var sticky = document.querySelector(".sticky-apply");
        var headerApply = document.querySelector(".sitenav__apply");
        var sectionNav = document.querySelector(".section-nav");
        var sectionLinks = sectionNav ? [].slice.call(sectionNav.querySelectorAll("a")) : [];
        var sectionEls = sectionLinks
          .map(function (a) { return document.querySelector(a.getAttribute("href")); })
          .filter(Boolean);
        var awakeTimer = 0;
        var ticking = false;

        function headerApplyScrolled(fraction) {
          if (!headerApply) return false;
          var r = headerApply.getBoundingClientRect();
          if (r.height <= 0) return false;
          return -r.top >= r.height * fraction;
        }

        function syncChrome() {
          ticking = false;
          if (sticky && headerApply) {
            var phone = window.matchMedia("(max-width: 899px)").matches;
            var show = headerApplyScrolled(phone ? 1 : 0.5);
            sticky.classList.toggle("is-on", show);
            if (show) {
              sticky.removeAttribute("aria-hidden");
              sticky.removeAttribute("tabindex");
            } else {
              sticky.setAttribute("aria-hidden", "true");
              sticky.setAttribute("tabindex", "-1");
            }
            document.body.classList.toggle("has-sticky-apply", show);
          }
          if (sectionEls.length) {
            var marker = window.innerHeight * 0.34;
            var current = sectionEls[0];
            sectionEls.forEach(function (el) {
              if (el.getBoundingClientRect().top <= marker) current = el;
            });
            sectionLinks.forEach(function (a) {
              if (a.getAttribute("href") === "#" + current.id) a.setAttribute("aria-current", "true");
              else a.removeAttribute("aria-current");
            });
          }
        }

        function requestSync() {
          if (ticking) return;
          ticking = true;
          window.requestAnimationFrame(syncChrome);
        }

        function wakeNav() {
          if (!sectionNav) return;
          sectionNav.classList.add("is-awake");
          window.clearTimeout(awakeTimer);
          awakeTimer = window.setTimeout(function () {
            sectionNav.classList.remove("is-awake");
          }, 850);
        }

        window.addEventListener("scroll", function () {
          wakeNav();
          requestSync();
        }, { passive: true });
        window.addEventListener("resize", requestSync);
        requestSync();
      })();
    </script>
