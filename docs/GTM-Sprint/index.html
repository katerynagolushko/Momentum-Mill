    <main id="main">
      <section class="hero" id="top" aria-label="GTM Sprint">
        <video
          class="hero__bg"
          data-copy="video"
          src="./public/video/founder-sales-reel.mp4?v=bezoszuck1"
          data-src-desktop="./public/video/founder-sales-reel.mp4?v=bezoszuck1"
          data-src-phone="./public/video/founder-sales-reel-phone.mp4?v=cut-blakely03"

          muted
          loop
          playsinline
          preload="auto"
          aria-hidden="true"

        <div class="hero__veil" aria-hidden="true"></div>
        <a class="brand" href="#top">gs</a>
        <div class="hero__copy">
          <p class="hero__sub" data-copy="hook"></p>
          <h1 class="hero__hook" data-copy="promise"></h1>

        </div>

      <section class="how" id="how" aria-label="How it works">

      <section class="split agenda-wrap" id="agenda" aria-label="Day 1 agenda">

    <script>
      (function () {
        var C = window.PAGE_COPY;
        if (!C) return;

        function $(sel) {
          return document.querySelector('[data-copy="' + sel + '"]');
        }

        function list(items, cls) {
          return (
            '<ul class="' + cls + '">' +
            items.map(function (item) { return "<li>" + item + "</li>"; }).join("") +
            "</ul>"
          );
        }

        var video = $("video");
        if (video && C.video) {
          var desktopSrc =
            C.video.src ||
            video.getAttribute("data-src-desktop") ||
            video.getAttribute("src");
          var phoneSrc =
            C.video.srcPhone || video.getAttribute("data-src-phone") || desktopSrc;
          var phoneMq = window.matchMedia("(max-width: 899px)");
          function applyHeroVideo() {
            var next = phoneMq.matches ? phoneSrc : desktopSrc;
            if (video.getAttribute("src") !== next) {
              video.src = next;
              video.load();
              var play = video.play();
              if (play && typeof play.catch === "function") play.catch(function () {});
            }
          }
          applyHeroVideo();
          if (typeof phoneMq.addEventListener === "function") {
            phoneMq.addEventListener("change", applyHeroVideo);
          } else if (typeof phoneMq.addListener === "function") {
            phoneMq.addListener(applyHeroVideo);
          }
        }

        var promise = $("promise");
        if (promise && C.promise) promise.textContent = C.promise;

        var hook = $("hook");
        if (hook && C.hook) hook.textContent = C.hook;

        var who = $("who");
        if (who && C.who) {
          who.innerHTML =
            '<span class="hero__for">' + C.who.lead + "</span>" +
            '<span class="hero__who-body">' +
            C.who.lines
              .map(function (line) {
                return '<span class="hero__who-line">' + line + "</span>";
              })
              .join("") +
            "</span>";
        }

        var how = $("how");
        if (how && C.how) {
          how.innerHTML =
            '<h2 class="sec__title">' + C.how.title + "</h2>" +
            '<p class="sec__lede">' + C.how.lede + "</p>" +
            '<ol class="steps">' +
            C.how.steps
              .map(function (s) {
                return (
                  '<li class="step">' +
                  '<h3 class="step__title">' + s.when + "</h3>" +
                  (s.lead ? '<p class="step__body">' + s.lead + "</p>" : "") +
                  (s.bullets && s.bullets.length ? list(s.bullets, "step__list") : "") +
                  "</li>"
                );
              })
              .join("") +
            "</ol>";
        }

        var agenda = $("agenda");
        if (agenda && C.agenda) {
          agenda.innerHTML =
            '<h2 class="split__title">' + C.agenda.title + "</h2>" +
            (C.agenda.lede ? '<p class="split__line">' + C.agenda.lede + "</p>" : "") +
            '<ol class="agenda">' +
            C.agenda.items
              .map(function (it) {
                return (
                  "<li>" +
                  '<span class="agenda__time">' + it.time + "</span>" +
                  "<span>" +
                  '<span class="agenda__what">' + it.what + "</span>" +
                  (it.note ? '<span class="agenda__note">' + it.note + "</span>" : "") +
                  "</span>" +
                  "</li>"
                );
              })
              .join("") +
            "</ol>";
        }

        var gets = $("gets");
        if (gets && C.gets) {
          gets.innerHTML =
            '<h2 class="split__title">' + C.gets.title + "</h2>" +
            '<ol class="gets">' +
            C.gets.items
              .map(function (it, i) {
                return (
                  "<li>" +
                  '<span class="gets__num">0' + (i + 1) + "</span>" +
                  "<span>" +
                  '<span class="gets__what">' + it.what + "</span>" +
                  (it.note ? '<span class="gets__note">' + it.note + "</span>" : "") +
                  "</span>" +
                  "</li>"
                );
              })
              .join("") +
            "</ol>";
        }

        ["agenda", "gets"].forEach(function (key) {
          var img = $(key + ".photo");
          if (img && C[key] && C[key].photo) {
            img.src = C[key].photo.src;
            img.alt = C[key].photo.alt || "";
          }
        });

        var why = $("why");
        if (why && C.why) {
          why.innerHTML =
            '<h2 class="why__title">' + C.why.title + "</h2>" +
            '<p class="why__body">' + C.why.body + "</p>";
        }

        var faq = $("faq");
        if (faq && C.faq && C.faq.items) {
          faq.innerHTML =
            '<h2 class="faq__title">' + C.faq.title + "</h2>" +
            '<div class="faq__list">' +
            C.faq.items
              .map(function (item) {
                return (
                  '<details class="faq__item">' +
                  "<summary>" +
                  '<span class="faq__q">' + item.q + "</span>" +
                  '<span class="faq__icon" aria-hidden="true"></span>' +
                  "</summary>" +
                  '<div class="faq__a">' + item.a + "</div>" +
                  "</details>"
                );
              })
              .join("") +
            "</div>";
        }

        var partnersLabel = $("partnersLabel");
        if (partnersLabel) partnersLabel.textContent = C.partnersLabel;

        var ctaLine = $("cta.line");
        if (ctaLine && C.cta) ctaLine.textContent = C.cta.line;

        var founder = $("cta.founder");
        if (founder && C.cta) {
          founder.href =
            "mailto:" + C.cta.mail + "?subject=" + encodeURIComponent(C.cta.founderSubject);
        }

        var partner = $("cta.partner");
        if (partner && C.cta) {
          partner.href =
            "mailto:" + C.cta.mail + "?subject=" + encodeURIComponent(C.cta.partnerSubject);
        }
      })();
    </script>
  </body>
</html>
